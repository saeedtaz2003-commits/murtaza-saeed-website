media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Articles
    type: collection
    path: src/content/posts
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Headline, type: string, required: true }
      - { name: slug, label: Short web address, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: date, label: Date, type: date, required: true }
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Business & Finance, Reviews & Experiences, Technology, Travel & Leisure]
      - { name: summary, label: Summary, type: text, required: true }
      - { name: image, label: Main image, type: image, required: true }
      - { name: imageAlt, label: Image description, type: string, required: true }
      - { name: draft, label: Keep as draft, type: boolean, default: false }
      - { name: body, label: Article, type: rich-text, required: true }
